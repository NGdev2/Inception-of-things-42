apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ftegan-app-gitlab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'http://172.17.0.1:8880/root/ftegan.git'
    path: configs
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
