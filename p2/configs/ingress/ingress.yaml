apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-apps
spec:
  rules:
  - host: app1.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app1-service  # Correct service name
            port:
              number: 80        # Service port, not target port
  - host: app2.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app2-service  # Correct service name
            port:
              number: 80        # Service port, not target port
  - host: app3.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app3-service  # Correct service name
            port:
              number: 80        # Service port, not target port
  # Default backend (when no host matches)
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app3-service  # Default to app3
            port:
              number: 80