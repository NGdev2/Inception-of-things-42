apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ftegan-app
  namespace: argocd
spec:
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/NGdev2/ftegan
    targetRevision: HEAD
    path: configs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
